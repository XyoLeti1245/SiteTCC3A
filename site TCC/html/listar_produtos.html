<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bolos</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f2f4f7;
        }

        /* TOPO */

        .topo {
            width: 100%;
            height: 70px;
            background-color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;

            box-shadow: 0 2px 8px rgba(0,0,0,0.10);
        }

        .topo h2 {
            color: #333;
        }

        .btn-voltar {
            text-decoration: none;
            background-color: #1976d2;
            color: white;

            padding: 10px 18px;
            border-radius: 6px;

            transition: 0.3s;
        }

        .btn-voltar:hover {
            background-color: #125ca8;
        }


        /* CONTAINER */

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }


        /* CABEÇALHO */

        .cabecalho-pagina {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 25px;
            gap: 20px;
        }

        .titulo h1 {
            color: #333;
            margin-bottom: 8px;
        }

        .titulo p {
            color: #777;
        }


        /* BOTÃO NOVO */

        .btn-novo {
            display: inline-block;

            text-decoration: none;
            background-color: #1976d2;
            color: white;

            padding: 12px 20px;
            border-radius: 7px;

            font-size: 14px;
            font-weight: bold;

            white-space: nowrap;

            transition: 0.3s;
        }

        .btn-novo:hover {
            background-color: #125ca8;
        }


        /* CAIXA DA TABELA */

        .lista-box {
            background-color: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow: 0 3px 12px rgba(0,0,0,0.10);
        }


        /* TABELA RESPONSIVA */

        .tabela-responsiva {
            width: 100%;
            overflow-x: auto;
        }


        /* TABELA */

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        thead {
            background-color: #f5f7f9;
        }

        th {
            padding: 15px;

            text-align: left;

            color: #444;

            font-size: 14px;

            border-bottom: 2px solid #e4e4e4;
        }

        td {
            padding: 15px;

            color: #555;

            font-size: 14px;

            border-bottom: 1px solid #eeeeee;

            vertical-align: middle;
        }

        tbody tr:hover {
            background-color: #f8f9fa;
        }


        /* IMAGEM */

        .imagem-bolo {
            width: 75px;
            height: 60px;

            object-fit: cover;

            border-radius: 7px;

            border: 1px solid #ddd;

            display: block;
        }


        /* PREÇOS */

        .preco {
            font-weight: bold;
            color: #333;
            white-space: nowrap;
        }


        /* STATUS */

        .status {
            display: inline-block;

            padding: 6px 11px;

            border-radius: 15px;

            font-size: 12px;
            font-weight: bold;
        }

        .ativo {
            background-color: #e8f5e9;
            color: #2e7d32;
        }


        /* AÇÕES */

        .acoes {
            display: flex;
            align-items: center;
            gap: 7px;
        }


        /* EDITAR */

        .btn-editar {
            display: inline-block;

            text-decoration: none;

            background-color: #1976d2;
            color: white;

            padding: 8px 14px;

            border-radius: 6px;

            font-size: 13px;

            border: none;

            cursor: pointer;

            transition: 0.3s;
        }

        .btn-editar:hover {
            background-color: #125ca8;
        }


        /* EXCLUIR */

        .btn-excluir {
            display: inline-block;

            border: none;

            background-color: #e53935;
            color: white;

            padding: 8px 14px;

            border-radius: 6px;

            font-size: 13px;

            cursor: pointer;

            transition: 0.3s;
        }

        .btn-excluir:hover {
            background-color: #c62828;
        }


        /* RESPONSIVO */

        @media(max-width: 700px) {

            .topo {
                padding: 0 20px;
            }

            .topo h2 {
                font-size: 18px;
            }

            .container {
                width: 94%;
                margin: 25px auto;
            }

            .cabecalho-pagina {
                flex-direction: column;
                align-items: flex-start;
            }

            .btn-novo {
                width: 100%;
                text-align: center;
            }

            .lista-box {
                padding: 18px;
            }

        }

    </style>

</head>

<body>

    <!-- TOPO -->

    <header class="topo">

        <h2>
            Painel Administrativo
        </h2>

        <a href="#" class="btn-voltar">
            Voltar
        </a>

    </header>


    <!-- CONTEÚDO -->

    <main class="container">

        <div class="cabecalho-pagina">

            <div class="titulo">

                <h1>
                    Bolos
                </h1>

                <p>
                    Consulte, altere ou exclua os bolos
                    cadastrados no sistema.
                </p>

            </div>


            <a href="#" class="btn-novo">
                + Cadastrar Bolo
            </a>

        </div>


        <!-- LISTAGEM -->

        <div class="lista-box">

            <div class="tabela-responsiva">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Imagem</th>

                            <th>Nome</th>

                            <th>Pequeno</th>

                            <th>Médio</th>

                            <th>Grande</th>

                            <th>Status</th>

                            <th>Ações</th>

                        </tr>

                    </thead>


                    <tbody>

                        <!-- BOLO ESTÁTICO -->

                        <tr>

                            <td>
                                1
                            </td>


                            <td>

                                <img
                                    src="imagens/bolo_chocolate.jpg"
                                    alt="Bolo de Chocolate"
                                    class="imagem-bolo"
                                >

                            </td>


                            <td>

                                <strong>
                                    Bolo de Chocolate
                                </strong>

                            </td>


                            <td>

                                <span class="preco">
                                    R$ 35,00
                                </span>

                            </td>


                            <td>

                                <span class="preco">
                                    R$ 50,00
                                </span>

                            </td>


                            <td>

                                <span class="preco">
                                    R$ 70,00
                                </span>

                            </td>


                            <td>

                                <span class="status ativo">
                                    Ativo
                                </span>

                            </td>


                            <td>

                                <div class="acoes">

                                    <a href="#"
                                       class="btn-editar">

                                        Editar

                                    </a>


                                    <button
                                        type="button"
                                        class="btn-excluir"
                                        onclick="confirmarExclusao()">

                                        Excluir

                                    </button>

                                </div>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>


    <script>

        function confirmarExclusao() {

            return confirm(
                'Tem certeza que deseja excluir o bolo "Bolo de Chocolate"?'
            );

        }

    </script>

</body>

</html>
